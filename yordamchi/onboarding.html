
<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topshiriq.uz — Joylashuv</title>
  <link rel="stylesheet" href="onboarding.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script>(async()=>{ await requireAuth(); })();</script>
<link rel="stylesheet" href="enhancements.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <a href="index.html" class="brand">Topshiriq.uz</a>
      <p class="brand-sub">Sizning mahalliy yordamchingiz</p>
    </div>
    <div class="steps">
      <span class="step active"></span>
      <span class="step"></span>
      <span class="step"></span>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="card">

      <h1 class="card-title">Qayerdasiz?</h1>
      <p class="card-sub">Atrofingizdagi topshiriqlarni ko'rish uchun manzilingizni belgilang.</p>

      <!-- MAP -->
      <div class="map-wrap" id="mapWrap">
        <div class="map-bg" id="mapBg">
          <!-- SVG city illustration -->
          <svg class="city-svg" viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg"
            preserveAspectRatio="xMidYMid slice">
            <!-- Sky gradient -->
            <defs>
              <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#d4edda" />
                <stop offset="100%" stop-color="#a8d8b0" />
              </linearGradient>
              <linearGradient id="roadGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#c8c8c0" />
                <stop offset="100%" stop-color="#b8b8b0" />
              </linearGradient>
            </defs>

            <!-- Background -->
            <rect width="620" height="220" fill="url(#skyGrad)" />

            <!-- Ground -->
            <rect x="0" y="150" width="620" height="70" fill="#8fbc8f" opacity="0.5" />

            <!-- Roads -->
            <rect x="0" y="148" width="620" height="10" fill="#b0b0a8" />
            <rect x="0" y="168" width="620" height="6" fill="#c8c8c0" opacity="0.5" />
            <rect x="200" y="0" width="10" height="220" fill="#b0b0a8" />
            <rect x="400" y="0" width="10" height="220" fill="#b0b0a8" />
            <!-- Road dashes -->
            <rect x="0" y="152" width="30" height="2" fill="white" opacity="0.5" />
            <rect x="50" y="152" width="30" height="2" fill="white" opacity="0.5" />
            <rect x="100" y="152" width="30" height="2" fill="white" opacity="0.5" />
            <rect x="150" y="152" width="30" height="2" fill="white" opacity="0.5" />
            <rect x="230" y="152" width="30" height="2" fill="white" opacity="0.5" />
            <rect x="280" y="152" width="30" height="2" fill="white" opacity="0.5" />
            <rect x="330" y="152" width="30" height="2" fill="white" opacity="0.5" />
            <rect x="430" y="152" width="30" height="2" fill="white" opacity="0.5" />
            <rect x="480" y="152" width="30" height="2" fill="white" opacity="0.5" />
            <rect x="550" y="152" width="30" height="2" fill="white" opacity="0.5" />

            <!-- Buildings left block -->
            <rect x="20" y="80" width="70" height="70" rx="3" fill="#d4e8d0" />
            <rect x="25" y="85" width="14" height="14" rx="1" fill="#9fc9a4" />
            <rect x="43" y="85" width="14" height="14" rx="1" fill="#9fc9a4" />
            <rect x="61" y="85" width="14" height="14" rx="1" fill="#b5d4b9" />
            <rect x="25" y="103" width="14" height="14" rx="1" fill="#b5d4b9" />
            <rect x="43" y="103" width="14" height="14" rx="1" fill="#9fc9a4" />
            <rect x="61" y="103" width="14" height="14" rx="1" fill="#9fc9a4" />
            <rect x="30" y="121" width="40" height="29" rx="2" fill="#c4dcc6" />

            <rect x="100" y="60" width="55" height="90" rx="3" fill="#cce8cc" />
            <rect x="106" y="66" width="12" height="12" rx="1" fill="#8fbf94" />
            <rect x="122" y="66" width="12" height="12" rx="1" fill="#a5d0a8" />
            <rect x="138" y="66" width="12" height="12" rx="1" fill="#8fbf94" />
            <rect x="106" y="82" width="12" height="12" rx="1" fill="#a5d0a8" />
            <rect x="122" y="82" width="12" height="12" rx="1" fill="#8fbf94" />
            <rect x="138" y="82" width="12" height="12" rx="1" fill="#a5d0a8" />
            <rect x="106" y="98" width="12" height="12" rx="1" fill="#8fbf94" />
            <rect x="122" y="98" width="12" height="12" rx="1" fill="#a5d0a8" />
            <rect x="138" y="98" width="12" height="12" rx="1" fill="#8fbf94" />
            <rect x="112" y="118" width="30" height="32" rx="2" fill="#b8d8b8" />

            <!-- Center buildings -->
            <rect x="220" y="50" width="80" height="100" rx="3" fill="#c8e8c4" />
            <rect x="226" y="56" width="16" height="16" rx="1" fill="#88bb8c" />
            <rect x="246" y="56" width="16" height="16" rx="1" fill="#a0cc9e" />
            <rect x="266" y="56" width="16" height="16" rx="1" fill="#88bb8c" />
            <rect x="284" y="56" width="10" height="16" rx="1" fill="#a0cc9e" />
            <rect x="226" y="76" width="16" height="16" rx="1" fill="#a0cc9e" />
            <rect x="246" y="76" width="16" height="16" rx="1" fill="#88bb8c" />
            <rect x="266" y="76" width="16" height="16" rx="1" fill="#a0cc9e" />
            <rect x="284" y="76" width="10" height="16" rx="1" fill="#88bb8c" />
            <rect x="226" y="96" width="16" height="16" rx="1" fill="#88bb8c" />
            <rect x="246" y="96" width="16" height="16" rx="1" fill="#a0cc9e" />
            <rect x="266" y="96" width="16" height="16" rx="1" fill="#88bb8c" />
            <rect x="236" y="118" width="50" height="32" rx="2" fill="#b0d4ae" />

            <rect x="310" y="70" width="65" height="80" rx="3" fill="#d0eacc" />
            <rect x="316" y="76" width="14" height="14" rx="1" fill="#96c49a" />
            <rect x="334" y="76" width="14" height="14" rx="1" fill="#acd4ac" />
            <rect x="352" y="76" width="14" height="14" rx="1" fill="#96c49a" />
            <rect x="316" y="94" width="14" height="14" rx="1" fill="#acd4ac" />
            <rect x="334" y="94" width="14" height="14" rx="1" fill="#96c49a" />
            <rect x="352" y="94" width="14" height="14" rx="1" fill="#acd4ac" />
            <rect x="322" y="116" width="40" height="34" rx="2" fill="#b8d8b4" />

            <!-- Right buildings -->
            <rect x="420" y="55" width="75" height="95" rx="3" fill="#cce8c8" />
            <rect x="426" y="61" width="15" height="15" rx="1" fill="#90c094" />
            <rect x="445" y="61" width="15" height="15" rx="1" fill="#a8d0a8" />
            <rect x="464" y="61" width="15" height="15" rx="1" fill="#90c094" />
            <rect x="426" y="80" width="15" height="15" rx="1" fill="#a8d0a8" />
            <rect x="445" y="80" width="15" height="15" rx="1" fill="#90c094" />
            <rect x="464" y="80" width="15" height="15" rx="1" fill="#a8d0a8" />
            <rect x="426" y="99" width="15" height="15" rx="1" fill="#90c094" />
            <rect x="445" y="99" width="15" height="15" rx="1" fill="#a8d0a8" />
            <rect x="432" y="118" width="46" height="32" rx="2" fill="#b4d4b0" />

            <rect x="510" y="75" width="60" height="75" rx="3" fill="#d4ecd0" />
            <rect x="516" y="81" width="13" height="13" rx="1" fill="#9ac49e" />
            <rect x="533" y="81" width="13" height="13" rx="1" fill="#aed0ae" />
            <rect x="550" y="81" width="13" height="13" rx="1" fill="#9ac49e" />
            <rect x="516" y="98" width="13" height="13" rx="1" fill="#aed0ae" />
            <rect x="533" y="98" width="13" height="13" rx="1" fill="#9ac49e" />
            <rect x="550" y="98" width="13" height="13" rx="1" fill="#aed0ae" />
            <rect x="518" y="118" width="44" height="32" rx="2" fill="#bcd8b8" />

            <!-- Trees -->
            <circle cx="165" cy="138" r="10" fill="#5a9e5a" opacity="0.7" />
            <circle cx="185" cy="135" r="8" fill="#4a8e4a" opacity="0.7" />
            <circle cx="390" cy="140" r="9" fill="#5a9e5a" opacity="0.7" />
            <circle cx="408" cy="136" r="7" fill="#4a8e4a" opacity="0.7" />
            <circle cx="600" cy="138" r="11" fill="#5a9e5a" opacity="0.7" />
          </svg>

          <!-- Pin marker -->
          <div class="map-pin" id="mapPin">
            <div class="pin-label">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                <circle cx="12" cy="10" r="3" />
              </svg>
              Siz
            </div>
            <div class="pin-dot"></div>
          </div>

          <!-- Radius ring -->
          <div class="radius-ring" id="radiusRing"></div>

          <!-- Crosshair button -->
          <button class="crosshair-btn" id="crosshairBtn" title="Joylashuvimni aniqlash">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
            </svg>
          </button>
        </div>
      </div>

      <!-- SEARCH -->
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <path d="M21 21l-4.35-4.35" />
        </svg>
        <input type="text" id="addressInput" placeholder="Manzilni kiriting (masalan: Yunusobod 4-mavze)"
          autocomplete="off">
        <button class="clear-btn" id="clearBtn" title="Tozalash">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
        <div class="suggestions" id="suggestions"></div>
      </div>

      <!-- RADIUS -->
      <div class="radius-section">
        <p class="radius-label">Qidiruv radiusi</p>
        <div class="radius-btns" id="radiusBtns">
          <button class="radius-btn active" data-km="1">1 km</button>
          <button class="radius-btn" data-km="2">2 km</button>
          <button class="radius-btn" data-km="3">3 km</button>
        </div>
      </div>

      <!-- SUBMIT -->
      <button class="btn-primary" id="submitBtn">
        <span class="btn-text">Davom etish</span>
        <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
        <span class="btn-loader" id="btnLoader"></span>
      </button>

    </div>
  </main>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="onboarding.js"></script>
<script src="enhancements.js"></script>
</body>

</html>
