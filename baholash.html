
<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vazifa Yakunlandi - Baholash</title>
    <link rel="stylesheet" href="baholash.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="auth.js"></script>
  <script>(async()=>{ await requireAuth(); })();</script>
<link rel="stylesheet" href="enhancements.css">
</head>

<body>

    <div class="modal-wrapper">

        <div class="rating-modal" id="ratingModal">

            <button class="close-btn">&times;</button>

            <p id="ratingLoadingState" style="text-align:center; padding:40px 0; color:#718096;">Yuklanmoqda...</p>

            <div id="ratingContent" style="display:none;">

                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>

                <h2 class="modal-title">Vazifa yakunlandi!</h2>
                <p class="modal-subtitle" id="ratingSubtitle"></p>

                <div class="profile-container">
                    <div class="avatar-wrapper">
                        <img src="" alt="" class="avatar-img" id="ratingAvatar">
                        <div class="verified-badge">
                            <i class="fas fa-check"></i>
                        </div>
                    </div>
                    <h3 class="profile-name" id="ratingProfileName"></h3>
                </div>

                <div class="rating-stars" id="ratingStars">
                    <i class="far fa-star" data-value="1"></i>
                    <i class="far fa-star" data-value="2"></i>
                    <i class="far fa-star" data-value="3"></i>
                    <i class="far fa-star" data-value="4"></i>
                    <i class="far fa-star" data-value="5"></i>
                </div>

                <div class="section-block">
                    <label class="block-label">Xos xislatlar (ko'p tanlovli):</label>
                    <div class="tags-container">
                        <span class="tag">Tez bajardi</span>
                        <span class="tag">Sifatli</span>
                        <span class="tag">Samimiy</span>
                        <span class="tag">Xushmuomala</span>
                        <span class="tag">Mas'uliyatli</span>
                    </div>
                </div>

                <div class="section-block">
                    <label class="block-label">Izoh (ixtiyoriy):</label>
                    <textarea class="comment-textarea" id="ratingComment"
                        placeholder="Boshqalarga tajribangiz haqida so'zlab bering..."></textarea>
                </div>

                <button class="submit-btn" id="ratingSubmitBtn">Baholashni yuborish</button>
            </div>

        </div>
    </div>

    <script src="baholash.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="enhancements.js"></script>
</body>

</html>
